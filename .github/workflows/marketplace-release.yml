name: Release to HumHub Marketplace

# A version tag (v1.2.3) builds the Marketplace ZIP and attaches it to a
# GitHub Release for that tag. Nothing is uploaded to the Marketplace then.
# Running the workflow manually from the Actions tab on a tag also uploads
# the ZIP to the Marketplace as a new module version.
#
# Required secret: MARKETPLACE_API_KEY — create it in the HumHub Partner
# Portal (partner.humhub.com) under your publisher account.
# The tag version must match "version" in module.json and must not have
# been uploaded before.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches module.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(python3 -c "import json;print(json.load(open('module.json'))['version'])")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag $TAG does not match module.json version $VERSION" >&2
            exit 1
          fi

      - name: Build Marketplace package
        run: python3 tests/bin/build-marketplace-zip.py --src . --out "metadata-cleaner-${GITHUB_REF_NAME#v}.zip"

      - name: Create GitHub Release with the package
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 - "$VERSION" > release-notes.md <<'PY'
          import sys
          lines = open('docs/CHANGELOG.md', encoding='utf-8').read().splitlines()
          notes, inside = [], False
          for i, line in enumerate(lines):
              heading = i + 1 < len(lines) and lines[i + 1].startswith('---')
              if heading:
                  inside = line.split(' ')[0] == sys.argv[1]
              elif inside and not line.startswith('---'):
                  notes.append(line)
          print('\n'.join(notes).strip())
          PY
          gh release create "$GITHUB_REF_NAME" "metadata-cleaner-${VERSION}.zip" \
            --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag

      - name: Upload to HumHub Marketplace
        if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/')
        env:
          MODULE_ID: metadata-cleaner
        run: |
          ZIP="metadata-cleaner-${GITHUB_REF_NAME#v}.zip"
          curl --fail \
            -F "key=${{ secrets.MARKETPLACE_API_KEY }}" \
            -F "ModuleVersionUpload[zipFile]=@${ZIP}" \
            "https://api.humhub.com/v1/marketplace/upload?moduleId=${MODULE_ID}"
